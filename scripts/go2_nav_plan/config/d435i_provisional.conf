# D435i -> base_link provisional extrinsic.
# NOT calibrated. Units: m and deg.
# camera_optical=1 means the VINS camera IMU frame is treated as the camera
# optical frame: X right, Y down, Z forward; base_link is X forward, Y left,
# Z up. measured=0 until the rotation and camera-IMU offset are verified.
#
# Source: docs/MEASUREMENT_CHECKLIST.md (2026-11-09).
#   base_link origin height above ground: 0.33 m
#   camera top height above ground: 0.395 m; D435i height ~0.025 m
#   camera center height above ground: ~0.3825 m
#   camera center above base_link: updated field measurement ~0.07 m
#   horizontal to camera front face: 0.36 m; minus half depth 0.0125 m
#   camera center forward: updated field measurement ~0.35 m
#   left/right: centered, 0 m
#   yaw/roll: 0 deg. Camera is measured to point upward by about 7 deg.
#   In fromYawPitchRoll(), positive pitch rotates base +X toward -Z (down);
#   therefore upward pitch is encoded as -7 deg. This sign follows the
#   right-handed R_y convention in body_state.cpp and is not a new calibration.
#
# These values point to the camera shell center. VINS outputs the camera IMU
# frame; if a camera-center-to-IMU offset is measured later, add it to tx/ty/tz
# in base_link coordinates, or measure directly to the IMU.
tx_m 0.35
ty_m 0.0
tz_m 0.07
yaw_deg 0.0
pitch_deg -7.0
roll_deg 0.0
camera_optical 1
measured 0
